name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an in-flight production upload. New PR checks may cancel old ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate public production configuration
        if: github.repository == 'knagai16/knagai-portal' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
        run: node -e 'if (!/^[A-Za-z0-9]{6,64}$/.test(process.env.PUBLIC_FORM_ID || "")) throw new Error("Configure the public Formspree ID before production deployment")'

      - name: Build
        env:
          # This ID is intentionally public in browser JavaScript. Never put secrets here.
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
        run: npm run build

      - name: Verify static export
        run: npm run test:static

      - name: Upload verified public files
        id: upload
        if: github.repository == 'knagai16/knagai-portal' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-site-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx --no-install jest --watchman=false --runInBand

  deploy:
    name: deploy
    needs: [web, infra]
    if: github.repository == 'knagai16/knagai-portal' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_PAGER: ''
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout reviewed deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.web.outputs.artifact-id }}
          path: out
          merge-multiple: true
          digest-mismatch: error

      - name: Refuse outdated deployments
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current_main" == "$GITHUB_SHA" ]] || { echo 'Refusing to deploy an outdated main commit.'; exit 1; }

      - name: Obtain short-lived AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          audience: sts.amazonaws.com
          role-session-name: portfolio-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          output-credentials: false
          retry-max-attempts: 3

      - name: Publish static files and verify production
        shell: bash
        run: bash scripts/deploy-static-site.sh
